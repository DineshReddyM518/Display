<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Counter Display Audit — Explainer</title>
<style>
  :root{
    --bg:#fdf6f3; --card:#ffffff; --maroon:#7a1f3d; --gold:#b8860b;
    --pink:#f6dbe3; --pink-soft:#fdf0f3; --text:#3a2530; --muted:#8a6b76;
    --border:#e6c9a8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241a1e; --card:#332328; --maroon:#e8a3bb; --gold:#e0b25c;
      --pink:#4a2f3a; --pink-soft:#3a262d; --text:#f2e6ea; --muted:#c9a9b5;
      --border:#5a4536;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241a1e; --card:#332328; --maroon:#e8a3bb; --gold:#e0b25c;
    --pink:#4a2f3a; --pink-soft:#3a262d; --text:#f2e6ea; --muted:#c9a9b5;
    --border:#5a4536;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: 'Segoe UI', 'Noto Sans Devanagari', Tahoma, Geneva, Verdana, sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:24px 12px 40px;
  }
  .wrap{ width:100%; max-width:760px; }
  .brand{
    text-align:center; letter-spacing:3px; font-size:12px; color:var(--gold);
    font-weight:700; margin-bottom:4px; text-transform:uppercase;
  }
  h1.title{
    text-align:center; color:var(--maroon); margin:0 0 18px; font-size:26px;
  }
  .deck{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:28px 26px 20px; min-height:340px; position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
  }
  .slide-tag{
    display:inline-block; background:var(--pink); color:var(--maroon);
    font-size:12px; font-weight:700; padding:4px 12px; border-radius:20px;
    margin-bottom:14px;
  }
  .slide-heading{ font-size:20px; font-weight:700; color:var(--maroon); margin:0 0 12px; }
  .lang-block{ margin-bottom:16px; }
  .lang-label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .en-text{ font-size:16px; line-height:1.55; }
  .hi-text{ font-size:17px; line-height:1.7; }
  .bullets{ margin:6px 0 0 18px; padding:0; }
  .bullets li{ margin-bottom:6px; }
  .controls{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:20px; gap:10px; flex-wrap:wrap;
  }
  button{
    font-family:inherit; border:none; cursor:pointer; border-radius:10px;
    padding:10px 16px; font-size:14px; font-weight:600; transition:opacity .15s;
  }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-nav{ background:var(--pink-soft); color:var(--maroon); border:1px solid var(--border); }
  .btn-nav:hover:not(:disabled){ opacity:.85; }
  .btn-play{ background:var(--maroon); color:#fff; }
  .btn-play:hover{ opacity:.9; }
  .dots{ display:flex; gap:6px; justify-content:center; margin-top:16px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--border); }
  .dot.active{ background:var(--maroon); }
  .status{
    text-align:center; font-size:12px; color:var(--muted); margin-top:10px; min-height:16px;
  }
  .voice-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; color:var(--muted); margin-top:6px; flex-wrap:wrap;
  }
  .img-row{
    display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;
  }
  .img-card{
    flex:1 1 220px; background:var(--pink-soft); border:1px solid var(--border);
    border-radius:12px; padding:8px; text-align:center;
  }
  .img-card img{
    width:100%; height:auto; max-height:220px; object-fit:contain;
    border-radius:8px; display:block; margin:0 auto 6px;
  }
  .img-caption{ font-size:11px; color:var(--muted); font-weight:600; }

  @media (max-width: 480px){
    body{ padding:14px 8px 28px; }
    h1.title{ font-size:20px; margin-bottom:14px; }
    .deck{ padding:18px 14px 16px; min-height:0; border-radius:12px; }
    .slide-heading{ font-size:17px; }
    .en-text{ font-size:15px; }
    .hi-text{ font-size:16px; }
    .img-row{ flex-direction:column; gap:10px; }
    .img-card{ flex-basis:auto; }
    .img-card img{ max-height:260px; }
    .controls{ justify-content:center; }
    .btn-nav{ flex:1 1 40%; text-align:center; }
    .btn-play{ order:-1; flex:1 1 100%; margin-bottom:8px; text-align:center; }
    .voice-row{ font-size:11px; }
  }
  select{
    font-size:12px; padding:4px 8px; border-radius:8px; border:1px solid var(--border);
    background:var(--pink-soft); color:var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Pretty Women Accessories</div>
  <h1 class="title">Counter Display Audit — Quick Explainer</h1>
  <div style="text-align:center;font-size:12px;color:var(--muted);margin:-8px 0 16px;">
    Tip: for voice narration to work, open this file in Chrome or Safari (not inside WhatsApp's built-in viewer).
  </div>

  <div class="deck" id="deck">
    <span class="slide-tag" id="slideTag">Slide 1 / 6</span>
    <h2 class="slide-heading" id="slideHeading"></h2>

    <div class="img-row" id="imgRow"></div>

    <div class="lang-block">
      <div class="lang-label">English</div>
      <div class="en-text" id="enText"></div>
    </div>
    <div class="lang-block">
      <div class="lang-label">हिन्दी</div>
      <div class="hi-text" id="hiText"></div>
    </div>

    <div class="controls">
      <button class="btn-nav" id="prevBtn">← Previous</button>
      <button class="btn-play" id="playBtn">🔊 Play narration</button>
      <button class="btn-nav" id="nextBtn">Next →</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="status" id="status">Tap "Play narration" to hear this slide.</div>
    <div class="voice-row">
      <span>Narration language:</span>
      <select id="voiceLang">
        <option value="both">English then Hindi</option>
        <option value="en">English only</option>
        <option value="hi">Hindi only</option>
      </select>
    </div>
  </div>
</div>

let idx = 0;
let voices = [];
const enTextEl = document.getElementById('enText');
const hiTextEl = document.getElementById('hiText');
const headingEl = document.getElementById('slideHeading');
const tagEl = document.getElementById('slideTag');
const dotsEl = document.getElementById('dots');
const statusEl = document.getElementById('status');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const voiceLangSel = document.getElementById('voiceLang');

function buildDots(){
  dotsEl.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === idx ? ' active' : '');
    dotsEl.appendChild(d);
  });
}

function render(){
  const s = slides[idx];
  headingEl.textContent = s.heading;
  enTextEl.textContent = s.en;
  hiTextEl.textContent = s.hi;

  const imgRow = document.getElementById('imgRow');
  imgRow.innerHTML = '';
  if (s.images && s.images.length){
    imgRow.style.display = 'flex';
    s.images.forEach(im => {
      const card = document.createElement('div');
      card.className = 'img-card';
      const img = document.createElement('img');
      img.src = im.src;
      img.alt = im.caption;
      const cap = document.createElement('div');
      cap.className = 'img-caption';
      cap.textContent = im.caption;
      card.appendChild(img);
      card.appendChild(cap);
      imgRow.appendChild(card);
    });
  } else {
    imgRow.style.display = 'none';
  }
  tagEl.textContent = `Slide ${idx+1} / ${slides.length}`;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === slides.length - 1;
  buildDots();
  statusEl.textContent = 'Tap "Play narration" to hear this slide.';
  window.speechSynthesis && window.speechSynthesis.cancel();
}

function pickVoice(langPrefix){
  if (!voices.length) return null;
  let v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
  if (!v && langPrefix === 'hi') v = voices.find(v => /hindi/i.test(v.name));
  if (!v && langPrefix === 'en') v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  return v || null;
}

function speakText(text, langPrefix, onend){
  if (!('speechSynthesis' in window)) { onend && onend(); return; }
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(langPrefix);
  if (v) u.voice = v;
  u.lang = langPrefix === 'hi' ? 'hi-IN' : 'en-IN';
  u.rate = 0.95;
  u.onend = () => onend && onend();
  u.onerror = () => onend && onend();
  window.speechSynthesis.speak(u);
}

function playSlide(){
  if (!('speechSynthesis' in window)){
    statusEl.textContent = 'Voice narration is not supported in this browser.';
    return;
  }
  window.speechSynthesis.cancel();
  const s = slides[idx];
  const mode = voiceLangSel.value;
  statusEl.textContent = '▶ Playing narration…';

  const doHindi = () => speakText(s.hi, 'hi', () => { statusEl.textContent = 'Done. Tap Next to continue.'; });
  const doEnglish = () => speakText(s.en, 'en', () => {
    if (mode === 'both') { doHindi(); } else { statusEl.textContent = 'Done. Tap Next to continue.'; }
  });

  if (mode === 'hi') { doHindi(); }
  else { doEnglish(); }
}

function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}

if ('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

playBtn.addEventListener('click', playSlide);
prevBtn.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
nextBtn.addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });

render();
</script>
</body>
</html>
